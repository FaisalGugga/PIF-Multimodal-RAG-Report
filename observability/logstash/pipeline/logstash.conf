input {
  beats {
    port => 5044
  }
}

filter {
  json {
    source => "message"
    target => "app"
  }

  if [app][timestamp] {
    date {
      match => [ "[app][timestamp]", "ISO8601" ]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "fastapi-rag-logs-%{+YYYY.MM.dd}"
  }

  stdout {
    codec => rubydebug
  }
}